name: sql-produccion

# El SQL también se despliega, pero con permiso. Al mergear a main un cambio en
# supabase/*.sql, este workflow muestra qué archivos va a aplicar en la base de
# producción y ESPERA la aprobación de Martín (environment produccion-sql, con
# "Required reviewers"). Aprobado, los aplica; rechazado, no pasa nada.
#
# Antes había que copiar cada archivo al SQL Editor a mano, y a veces quedaba sin
# aplicar (errores_app estuvo días así). Cada archivo corre entero o no corre
# (ver bin/sql-produccion.js), y los marcados `-- sql-produccion: manual` nunca
# se aplican solos.
#
# Configuración (una vez): environment produccion-sql, solo rama main, Required
# reviewers: Martín, secreto PRODUCCION_DB_URL (Connect → Session pooler: GitHub
# no tiene IPv6).
on:
  push:
    branches: [main]
    paths: ['supabase/*.sql']
  # Para aplicar algo que ya está en main (por ejemplo, un archivo que se mergeó
  # antes de que existiera este workflow): Actions → sql-produccion → Run workflow.
  workflow_dispatch:
    inputs:
      archivos:
        description: Archivos a aplicar, separados por espacio (ej. supabase/resumen_semanal.sql)
        required: true

concurrency:
  group: sql-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      aplicar: ${{ steps.plan.outputs.aplicar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Qué se va a aplicar
        id: plan
        env:
          ANTES: ${{ github.event.before }}
          PEDIDOS: ${{ inputs.archivos }}
        run: |
          if [ -n "$PEDIDOS" ]; then lista="$PEDIDOS"
          else lista=$(git diff --name-only --diff-filter=AM "$ANTES" "$GITHUB_SHA" -- 'supabase/*.sql' | tr '\n' ' '); fi
          node bin/sql-produccion.js $lista > plan.txt
          cat plan.txt
          {
            echo "## SQL para producción"
            if grep -q '^aplicar' plan.txt; then
              echo "Al aprobar, se aplican en este orden:"
              grep '^aplicar' plan.txt | while read -r _ f modo; do
                echo "- [\`$f\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$f) · $([ "$modo" = una ] && echo 'en una transacción' || echo 'con su propio begin/commit')"
              done
            else
              echo "Nada que aplicar."
            fi
            grep '^manual' plan.txt | while read -r _ f; do echo "- \`$f\` es solo a mano: no se aplica."; done
            if [ -z "$PEDIDOS" ] && grep -q '^aplicar' plan.txt; then
              echo; echo "### Qué cambia"; echo '```diff'
              git diff "$ANTES" "$GITHUB_SHA" -- $(grep '^aplicar' plan.txt | cut -d' ' -f2) | head -300
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "aplicar=$(grep '^aplicar' plan.txt | awk '{print $2":"$3}' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  aplicar:
    needs: revisar
    if: needs.revisar.outputs.aplicar != ''
    runs-on: ubuntu-latest
    environment: produccion-sql
    steps:
      - uses: actions/checkout@v5
      - name: Aplicar en producción
        env:
          PRODUCCION_DB_URL: ${{ secrets.PRODUCCION_DB_URL }}
          PLAN: ${{ needs.revisar.outputs.aplicar }}
        run: |
          if [ -z "$PRODUCCION_DB_URL" ]; then
            echo "::error::Falta el secreto PRODUCCION_DB_URL en el environment produccion-sql"; exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          echo "## Aplicado en producción" >> "$GITHUB_STEP_SUMMARY"
          for item in $PLAN; do
            f=${item%%:*}; modo=${item##*:}
            echo "::group::$f"
            if [ "$modo" = una ]; then
              psql "$PRODUCCION_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            else
              psql "$PRODUCCION_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            fi
            echo "::endgroup::"
            echo "- ✅ \`$f\`" >> "$GITHUB_STEP_SUMMARY"
          done

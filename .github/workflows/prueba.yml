name: prueba

# El proyecto de PRUEBA de Supabase: cuentas falsas, nunca datos de nadie.
#
# - En cada PR que toca supabase/ o app-session.js: aplica al proyecto de prueba
#   los .sql que cambió el PR y corre bin/prueba-e2e.js (aislamiento entre
#   cuentas, sync condicional, cambio de contraseña, borrar cuenta sin dejar
#   filas). Así el SQL se prueba ANTES de pegarlo en producción.
# - A mano (Run workflow → copiar_esquema): copia el esquema de producción al de
#   prueba, sin datos. Se usa al crearlo y cuando se desalinee.
#
# Configuración (una vez), en Settings → Environments:
#   supabase-prueba       PRUEBA_SUPABASE_URL, PRUEBA_PUBLISHABLE_KEY,
#                         PRUEBA_SECRET_KEY, PRUEBA_DB_URL (Session pooler)
#   produccion-esquema    PRODUCCION_DB_URL (Session pooler), con "Required
#                         reviewers": la copia espera la aprobación de Martín.
# Sin esos secretos los jobs avisan y terminan sin fallar.
on:
  pull_request:
    paths: ['supabase/**', 'app-session.js', 'bin/prueba-e2e.js', '.github/workflows/prueba.yml']
  workflow_dispatch:
    inputs:
      copiar_esquema:
        description: Copiar antes el esquema de producción (sin datos) al proyecto de prueba
        type: boolean
        default: false

concurrency:
  group: supabase-prueba
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  esquema:
    if: github.event_name == 'workflow_dispatch' && inputs.copiar_esquema
    runs-on: ubuntu-latest
    environment: produccion-esquema
    steps:
      - uses: actions/checkout@v5
      - name: Cliente de Postgres 17
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Copiar el esquema (sin datos)
        env:
          PRODUCCION_DB_URL: ${{ secrets.PRODUCCION_DB_URL }}
          PRUEBA_DB_URL: ${{ secrets.PRUEBA_DB_URL }}
        run: |
          if [ -z "$PRODUCCION_DB_URL" ] || [ -z "$PRUEBA_DB_URL" ]; then
            echo "::notice::Faltan PRODUCCION_DB_URL o PRUEBA_DB_URL: no se copió el esquema."; exit 0
          fi
          # El destino nunca puede ser producción (su ref está en la URL de la app).
          REF=$(grep -o "https://[a-z0-9]*\.supabase\.co" app-session.js | head -1 | sed 's#https://##; s#\.supabase\.co##')
          case "$PRUEBA_DB_URL" in *"$REF"*) echo "::error::PRUEBA_DB_URL apunta a producción"; exit 1;; esac
          PG=/usr/lib/postgresql/17/bin
          # Solo las definiciones: tablas, RLS, políticas, funciones y permisos de
          # public y admin. Nunca filas.
          "$PG/pg_dump" "$PRODUCCION_DB_URL" --schema-only --no-owner --schema=public --schema=admin -f esquema.sql
          "$PG/psql" "$PRUEBA_DB_URL" -v ON_ERROR_STOP=0 -q -f esquema.sql 2> errores.txt || true
          # "ya existe" es lo esperado al volver a copiar; cualquier otro error, no.
          if grep -v "already exists" errores.txt | grep "ERROR"; then echo "::error::El esquema no se aplicó entero (arriba, qué falló)"; exit 1; fi
          echo "Esquema copiado: $(grep -c '^CREATE TABLE' esquema.sql) tablas, $(grep -c '^CREATE FUNCTION' esquema.sql) funciones"

  e2e:
    needs: esquema
    if: ${{ !cancelled() && (needs.esquema.result == 'success' || needs.esquema.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: supabase-prueba
    env:
      PRUEBA_SUPABASE_URL: ${{ secrets.PRUEBA_SUPABASE_URL }}
      PRUEBA_PUBLISHABLE_KEY: ${{ secrets.PRUEBA_PUBLISHABLE_KEY }}
      PRUEBA_SECRET_KEY: ${{ secrets.PRUEBA_SECRET_KEY }}
      PRUEBA_DB_URL: ${{ secrets.PRUEBA_DB_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Aplicar el SQL de este PR al proyecto de prueba
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$PRUEBA_DB_URL" ]; then echo "::notice::Falta PRUEBA_DB_URL: no se aplicó SQL."; exit 0; fi
          # Nunca contra producción: la URL de la app no puede estar en la conexión.
          REF=$(grep -o "https://[a-z0-9]*\.supabase\.co" app-session.js | head -1 | sed 's#https://##; s#\.supabase\.co##')
          case "$PRUEBA_DB_URL" in *"$REF"*) echo "::error::PRUEBA_DB_URL apunta a producción"; exit 1;; esac
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'supabase/*.sql' > cambiados.txt
          if [ ! -s cambiados.txt ]; then echo "El PR no cambia SQL."; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          while read -r f; do
            echo "Aplicando $f"
            psql "$PRUEBA_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done < cambiados.txt

      - name: Pruebas con cuentas falsas
        run: node bin/prueba-e2e.js
